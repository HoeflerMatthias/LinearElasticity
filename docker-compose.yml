services:
  mlflow-server-local:
    container_name: mlflow-server-local
    image: mlflow-server-local:latest
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      - MLFLOW_HOST=${MLFLOW_HOST:-0.0.0.0}
      - MLFLOW_PORT=${MLFLOW_PORT:-5000}
      - MLFLOW_SERVER_HOST=${MLFLOW_SERVER_HOST:-localhost}
      - MLFLOW_SERVER_PORT=${MLFLOW_SERVER_PORT:-8080}
    volumes:
      - ./mlflow/artifacts:/mlflow/artifacts
      - ./mlflow/backend:/mlflow/backend
    ports:
      - "${MLFLOW_SERVER_PORT:-8080}:5000"
    networks:
      - mlflow-network
    command: >
      mlflow server
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000

  firedrake:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/opt/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 128gb
    cpus: 128
    environment:
      - MLFLOW_TRACKING_URI=http://host.docker.internal:8080
      - OMP_NUM_THREADS=16
      - OPENBLAS_NUM_THREADS=16

  pinns:
    build:
      context: .
      dockerfile: Dockerfile.pinns
    volumes:
      - .:/opt/project
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MLFLOW_TRACKING_URI=http://host.docker.internal:8080
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
networks:
  mlflow-network:
    driver: bridge
