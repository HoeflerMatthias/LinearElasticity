services:
  mlflow-server-local:
    container_name: mlflow-server-local
    image: ghcr.io/mlflow/mlflow:v3.9.0
    environment:
      - MLFLOW_HOST=${MLFLOW_HOST:-0.0.0.0}
      - MLFLOW_PORT=${MLFLOW_PORT:-5000}
      - MLFLOW_SERVER_HOST=${MLFLOW_SERVER_HOST:-localhost}
      - MLFLOW_SERVER_PORT=${MLFLOW_SERVER_PORT:-8080}
    volumes:
      - ./mlflow/artifacts:/mlflow/artifacts
      - ./mlflow/backend:/mlflow/backend
    ports:
      - "${MLFLOW_SERVER_PORT:-8080}:5000"
    networks:
      - mlflow-network
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/backend/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "localhost:*,127.0.0.1:*,mlflow-server-local:*,host.docker.internal:*"

  firedrake:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/opt/project
    networks:
      - mlflow-network
    depends_on:
      - mlflow-server-local
    shm_size: 128gb
    cpus: 128
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server-local:5000
      - OMP_NUM_THREADS=16
      - OPENBLAS_NUM_THREADS=16

  pinns:
    build:
      context: .
      dockerfile: Dockerfile.pinns
    volumes:
      - .:/opt/project
    networks:
      - mlflow-network
    depends_on:
      - mlflow-server-local
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server-local:5000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]
networks:
  mlflow-network:
    driver: bridge
