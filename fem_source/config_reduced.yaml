# Reduced (adjoint) inverse solver configuration

data_csv: "/opt/project/data/linear_symcube_two_inclusions_p10.h5"

# Geometry (inverse mesh)
Nx_inv: 60
Ny_inv: 60
Nz_inv: 30

# Physics
lambda_: 650.0
mu: 8.0
p_load: 10.0

# Noise
noise_level: 0.1
